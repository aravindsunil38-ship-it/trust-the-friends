<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trust the Friends</title>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e2a20;--panel:#163a2d;--chalk:#eef3e6;--gold:#ffd23f;--pink:#ff5c8a;--line:#2c5a47}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--chalk);font:500 17px/1.5 Nunito,system-ui,sans-serif;padding:16px;display:flex;flex-direction:column;align-items:center}
h1{font:400 clamp(30px,7vw,52px)/1 "Bowlby One",Impact,sans-serif;color:var(--gold);margin:8px 0 14px;text-align:center;transform:rotate(-1.5deg)}
h2{font:400 24px/1.2 "Bowlby One",Impact,sans-serif;margin:0 0 10px}
main,#board{width:100%;max-width:640px}
#board{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:99px;padding:2px 12px;font-weight:800;font-size:14px}
.chip b{color:var(--gold)}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
button,select,input{font:800 16px Nunito,sans-serif;border-radius:10px;border:2px solid var(--chalk);padding:10px 14px;margin:4px 4px 4px 0;background:var(--bg);color:var(--chalk)}
button{cursor:pointer;background:var(--gold);color:#1b1b1b;border-color:var(--gold)}
button.pick{background:var(--bg);color:var(--chalk);border-color:var(--chalk)}
button:hover{filter:brightness(1.1)}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
label.opt{display:inline-block;margin:3px 6px 3px 0;padding:4px 10px;border:2px solid var(--line);border-radius:99px;cursor:pointer}
label.opt:has(input:checked){border-color:var(--gold);background:#24503e}
label.opt input{margin:0 6px 0 0;padding:0}
#err{color:var(--pink);font-weight:800;min-height:1.5em}
summary{cursor:pointer;font-weight:800}
small{opacity:.8;display:block}
.bat{display:inline-block;transform-origin:90% 90%;animation:swing .45s ease-in-out 3}
@keyframes swing{0%{transform:rotate(-60deg)}60%{transform:rotate(40deg)}100%{transform:rotate(-10deg)}}
@media(prefers-reduced-motion:reduce){.bat{animation:none}}
</style></head><body>
<h1>Trust the Friends</h1>
<div id="board"></div><main id="screen"></main><p id="err" role="alert"></p>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io(), $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const screen = (h) => ($("screen").innerHTML = h), err = (m) => ($("err").textContent = m || "");
let players = [], host = "", phase = "home", code = "", local = null, pcs = {};
const others = () => players.filter((p) => p.id !== socket.id);
const url = (audio, mime) => URL.createObjectURL(new Blob([audio], { type: mime }));
const setMic = (on) => local && local.getAudioTracks().forEach((t) => (t.enabled = on));

/* ---------- voice chat (WebRTC mesh) ---------- */
async function initVoice() { try { local = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch { err("Mic blocked: you can listen but not talk."); } }
function pc(id) {
  if (pcs[id]) return pcs[id];
  const c = (pcs[id] = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] }));
  if (local) local.getTracks().forEach((t) => c.addTrack(t, local)); else c.addTransceiver("audio", { direction: "recvonly" });
  c.onicecandidate = (e) => e.candidate && socket.emit("signal", { to: id, data: { ice: e.candidate } });
  c.ontrack = (e) => { let a = $("a" + id); if (!a) { a = document.createElement("audio"); a.id = "a" + id; a.autoplay = true; document.body.appendChild(a); } a.srcObject = e.streams[0]; };
  return c;
}
socket.on("signal", async ({ from, data }) => {
  const c = pc(from);
  if (data.sdp) {
    await c.setRemoteDescription(data.sdp);
    if (data.sdp.type === "offer") { await c.setLocalDescription(await c.createAnswer()); socket.emit("signal", { to: from, data: { sdp: c.localDescription } }); }
  } else if (data.ice) { try { await c.addIceCandidate(data.ice); } catch {} }
});
async function syncCalls() {
  Object.keys(pcs).forEach((id) => { if (!players.some((p) => p.id === id)) { pcs[id].close(); delete pcs[id]; const a = $("a" + id); a && a.remove(); } });
  for (const p of others()) if (!pcs[p.id] && socket.id > p.id) { const c = pc(p.id); await c.setLocalDescription(await c.createOffer()); socket.emit("signal", { to: p.id, data: { sdp: c.localDescription } }); }
}

/* ---------- recording ---------- */
let rec, chunks, blob, timer;
const recHtml = (send) => `<button id="rb" onclick="toggleRec()">Start recording</button><br><audio id="pv" controls hidden></audio><br><button id="sb" hidden onclick="${send}()">Send</button>`;
async function toggleRec() {
  if (rec && rec.state === "recording") return rec.stop();
  let s; try { s = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch { return err("Mic blocked. Allow microphone access and try again."); }
  err(); setMic(false);
  rec = new MediaRecorder(s); chunks = [];
  rec.ondataavailable = (e) => chunks.push(e.data);
  rec.onstop = () => { clearTimeout(timer); s.getTracks().forEach((t) => t.stop()); blob = new Blob(chunks, { type: rec.mimeType }); $("pv").src = URL.createObjectURL(blob); $("pv").hidden = $("sb").hidden = false; $("rb").textContent = "Record again"; };
  rec.start(); $("rb").textContent = "Stop"; timer = setTimeout(() => rec.state === "recording" && rec.stop(), 10000);
}
const upload = async () => ({ audio: await blob.arrayBuffer(), mime: blob.type });

/* ---------- home & lobby ---------- */
function home() { phase = "home"; screen(`<div class="card"><input id="name" placeholder="Your name" maxlength="14"><br><select id="max"><option value="6">6 players</option><option value="10">10 players</option></select><button onclick="create()">Create room</button></div><div class="card"><input id="code" placeholder="Room code" maxlength="4" size="8"><button onclick="join()">Join room</button></div><small>Allow your microphone when asked: the game uses voice chat. Mimic clips and favorite lines are recorded and deleted when the game ends.</small>`); }
const nameVal = () => $("name").value.trim() || "Player";
async function create() { err(); await initVoice(); socket.emit("createRoom", { name: nameVal(), maxPlayers: +$("max").value }); }
async function join() { err(); const n = nameVal(), c = $("code").value.trim().toUpperCase(); await initVoice(); socket.emit("joinRoom", { name: n, code: c }); }
function lobby() { screen(`<div class="card"><h2>Room ${esc(code)}</h2><p>Share this code with your friends.</p>${players.map((p) => `<span class="chip">${esc(p.name)}</span>`).join(" ")}<p>${socket.id === host ? `<button onclick="socket.emit('startGame')">Start game</button>` : "Waiting for the host to start..."}</p></div>`); }
socket.on("roomJoined", (d) => { code = d.code; phase = "lobby"; });
socket.on("players", (d) => { players = d.list; host = d.host; $("board").innerHTML = players.map((p) => `<span class="chip">${esc(p.name)} <b>${p.score}</b></span>`).join(""); if (phase === "lobby") lobby(); syncCalls(); });
socket.on("errorMsg", err);
socket.on("info", (t) => { phase = "info"; screen(`<div class="card"><h2>${esc(t)}</h2></div>`); });
const nextBtn = () => (socket.id === host ? `<button onclick="socket.emit('next')">Continue</button>` : "<small>Waiting for the host to continue...</small>");

/* ---------- dialogue ---------- */
socket.on("dialogue", () => { phase = "dialogue"; setMic(false); screen(`<div class="card"><h2>Record your favorite line</h2><p>Say a line you're famous for (up to 10 seconds). A friend will have to mimic it later, so make it count.</p>${recHtml("sendDialogue")}</div>`); });
async function sendDialogue() { socket.emit("submitDialogue", await upload()); screen(`<div class="card"><h2>Line saved</h2><p>Waiting for the others...</p></div>`); }

/* ---------- questions ---------- */
socket.on("question", (d) => { phase = "voting"; setMic(true); screen(`<div class="card"><small>Round ${d.round}, question ${d.n} of ${d.total}</small><h2>${esc(d.text)}</h2>${d.players.filter((p) => p.id !== socket.id).map((p) => `<button class="pick" onclick="vote('${p.id}')">${esc(p.name)}</button>`).join("")}</div>`); });
function vote(id) { socket.emit("vote", { targetId: id }); screen(`<div class="card"><h2>Vote locked in</h2><p>Waiting for the others...</p></div>`); }

/* ---------- guessing ---------- */
let guessN = 0;
socket.on("guess", (d) => {
  phase = "guess"; guessN = d.summary.length;
  screen(`<h2>Round ${d.round}: who voted for you?</h2><p>Tick everyone you think voted for you on each question. Explain your reasoning in voice chat. Correct: +1. Wrong or missed: a bat hit.</p>` +
    d.summary.map((s, i) => `<div class="card"><b>${esc(s.q)}</b><br>${d.players.map((p) => `<span class="chip">${esc(p.name)} <b>${s.counts[p.id]}</b></span>`).join(" ")}<p>You got <b>${s.counts[socket.id] || 0}</b> votes. Who voted for you?</p>${others().map((p) => `<label class="opt"><input type="checkbox" data-q="${i}" value="${p.id}">${esc(p.name)}</label>`).join("")}</div>`).join("") +
    `<button onclick="sendGuess()">Lock in guesses</button>`);
});
function sendGuess() {
  const guesses = []; for (let i = 0; i < guessN; i++) guesses.push([...document.querySelectorAll(`input[data-q="${i}"]:checked`)].map((x) => x.value));
  socket.emit("submitGuess", { guesses }); screen(`<div class="card"><h2>Guesses locked</h2><p>Waiting for the others...</p></div>`);
}
socket.on("guessResults", ({ hits }) => {
  phase = "guessDone";
  const by = {}; hits.forEach((h) => (by[h.victim] = (by[h.victim] || []).concat(h)));
  const names = Object.keys(by);
  screen(`<h2>The bat comes out</h2>` + (names.length ? names.map((n) => `<details class="card" open><summary>${esc(n)} took ${by[n].length} hit${by[n].length > 1 ? "s" : ""} <span class="bat">🏏</span></summary>${by[n].map((h) => `<small>${esc(h.hitter)} hit ${esc(n)} (${h.why}): ${esc(h.q)}</small>`).join("")}</details>`).join("") : `<div class="card">Perfect round. Nobody got hit!</div>`) + nextBtn());
});

/* ---------- mimic ---------- */
socket.on("mimicTask", (d) => { phase = "mimic"; setMic(false); screen(`<div class="card"><h2>Mimic ${esc(d.target)}</h2><p>Listen to their line, then record your best impression. Your mic is muted for the room until you send it.</p><audio controls src="${url(d.audio, d.mime)}"></audio><br>${recHtml("sendMimic")}</div>`); });
async function sendMimic() { socket.emit("submitMimic", await upload()); setMic(true); }
socket.on("mimicVote", (d) => {
  phase = "mimicVote"; setMic(true);
  const opts = others().map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
  screen(`<div class="card"><h2>Who is faking it?</h2><audio controls autoplay src="${url(d.audio, d.mime)}"></audio><p>Who mimicked?<br><select id="who">${opts}</select></p>${d.isTarget ? "<small>It's your voice, so you only guess the mimicker: +3 if right.</small>" : `<p>Whose voice was it?<br><select id="whose">${opts}</select></p>`}<button onclick="sendMV()">Lock in</button></div>`);
});
function sendMV() { socket.emit("submitMimicVote", { who: $("who").value, whose: $("whose") ? $("whose").value : null }); screen(`<div class="card"><h2>Answer locked</h2><p>Waiting for the others...</p></div>`); }
socket.on("mimicResult", (d) => { phase = "mimicDone"; screen(`<div class="card"><h2>${esc(d.mimicker)} mimicked ${esc(d.target)}</h2>${d.lines.map((l) => `<small>${esc(l)}</small>`).join("")}</div>${nextBtn()}`); });

socket.on("over", ({ players: ps }) => { phase = "over"; screen(`<h2>Game over</h2>${[...ps].sort((a, b) => b.score - a.score).map((p, i) => `<div class="card">${i === 0 ? "🏆 " : ""}<b>${esc(p.name)}</b>: ${p.score} points</div>`).join("")}`); });
home();
</script></body></html>
